version: '3.9'

services:
  postgres-aibank:
    image: postgres:16
    container_name: postgres-aibank
    hostname: aibank
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aibank
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/aibank:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-analysis:
    image: postgres:16
    container_name: postgres-analysis
    hostname: analysis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: analysis
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/analysis:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # =========================
      # KRaft
      # =========================
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # =========================
      # Listeners
      # =========================
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9091,INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # =========================
      # Controller
      # =========================
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9091

      # =========================
      # Broker
      # =========================
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # =========================
      # Single broker
      # =========================
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # =========================
      # Development
      # =========================
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - ./kafka/kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  debezium-connect:
    image: debezium/connect:3.0.0.Final
    container_name: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9093
      GROUP_ID: 1

      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses

      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1

      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter

      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"

      REST_ADVERTISED_HOST_NAME: debezium-connect

      PLUGIN_PATH: /kafka/connect
    depends_on:
      postgres-aibank:
        condition: service_healthy
      kafka:
        condition: service_started

  ai-bank-app:
    build:
      context: ./aibank
      dockerfile: Dockerfile
    # image: openoneapp/ai-bank-app:latest
    container_name: ai-bank-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres-aibank:5432/aibank?schema=public
      BETTER_AUTH_SECRET: 04a70603e27df6422e01aeccb1a2c5df865c759d20d242c86723636eb17e5fe0
      BETTER_AUTH_URL: http://localhost:3000
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_FRAUD_PREDICTION_TOPIC: fraud-predictions
    depends_on:
      postgres-aibank:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: on-failure

  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: core-api
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      KAFKA_FRAUD_PREDICTION_TOPIC: fraud-predictions
      MODEL_PATH: app/models/fraud_model.pkl
      FRAUD_TYPE_MODEL_PATH: app/models/fraud_type_model.pkl
      LOG_LEVEL: INFO
    depends_on:
      kafka:
        condition: service_started
    restart: on-failure

  flink-jobmanager:
    image: flink:1.20.1-java17
    container_name: flink-jobmanager
    hostname: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    depends_on:
      - kafka
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar
      - ./flink/sql:/opt/flink/sql

  flink-taskmanager:
    image: flink:1.20.1-java17
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar

  flink-sql-runner:
    image: flink:1.20.1-java17
    container_name: flink-sql-runner
    depends_on:
        kafka:
          condition: service_healthy
        flink-jobmanager:
          condition: service_started
        flink-taskmanager:
          condition: service_started
    entrypoint: ["/bin/bash", "/opt/flink/sql/run-job.sh"]
    volumes:
      - ./flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar:/opt/flink/lib/flink-sql-connector-kafka-3.3.0-1.20.jar
      - ./flink/sql:/opt/flink/sql